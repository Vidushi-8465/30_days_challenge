<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document Summarizer</title>

    <style>
        body {
            background-color: #ffe6f0;
            font-family: "Segoe UI", sans-serif;
            color: #4a0033;
        }

        .container {
            width: 60%;
            margin: auto;
            margin-top: 60px;
            background-color: #fff0f6;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            color: #b30059;
            text-align: center;
        }

        input[type="file"] {
            margin-top: 15px;
        }

        select {
            padding: 8px;
            border-radius: 8px;
            border: none;
            margin-top: 10px;
        }

        button {
            background-color: #ff85b3;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ff5fa2;
        }

        #output {
            margin-top: 30px;
            white-space: pre-wrap;
        }

        a {
            color: #b30059;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>💗 AI Document Summarizer</h1>

    <form id="form">
        <input type="file" name="pdf" required>

        <br><br>

        <label>Summary Length:</label>
        <select name="length">
            <option value="short">Short</option>
            <option value="medium" selected>Medium</option>
            <option value="long">Detailed</option>
        </select>

        <br><br>

        <button type="submit">✨ Summarize</button>
    </form>

    <div id="output"></div>

    <br>
    <a href="/download">📥 Download Summary as PDF</a>
</div>

<script>
const form = document.getElementById("form");
const output = document.getElementById("output");

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    output.innerText = "";

    const response = await fetch("/summarize", {
        method: "POST",
        body: new FormData(form)
    });

    const reader = response.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        output.innerText += decoder.decode(value);
    }
});
</script>
</body>
</html>
