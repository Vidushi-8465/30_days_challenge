<!DOCTYPE html>
<html>
<head>
    <title>PDF Summarizer (Groq)</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }
        .container {
            max-width: 800px;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 260px;
            margin-top: 15px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📄 PDF Document Summarizer (Groq Streaming)</h2>

    <input type="file" id="pdf">
    <br>
    <button onclick="uploadPDF()">Summarize</button>
    <button onclick="downloadPDF()">Download Summary PDF</button>

    <h3>🧠 Summary</h3>
    <textarea id="output" readonly></textarea>
</div>

<script>
function uploadPDF() {
    const fileInput = document.getElementById("pdf");
    const output = document.getElementById("output");
    output.value = "";

    const formData = new FormData();
    formData.append("pdf", fileInput.files[0]);

    fetch("/summarize", {
        method: "POST",
        body: formData
    }).then(response => {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        function read() {
            reader.read().then(({done, value}) => {
                if (done) return;
                output.value += decoder.decode(value);
                read();
            });
        }
        read();
    });
}

function downloadPDF() {
    window.location.href = "/download";
}
</script>
</body>
</html>
